[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Robust Cost-Aware LLM Routing under Workload and Cost Drift using Contextual Bandits"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",          # cho_factor/cho_solve in linucb.py; stats in analysis scripts
    "matplotlib>=3.8",      # figures produced by scripts/09 and scripts/13
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=1.0",
    "datasets>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
embed = ["sentence-transformers>=3.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
